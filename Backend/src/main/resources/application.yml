spring:
  datasource:
    url: ${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/nodevoltex_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

server:
  port: ${PORT:8082}

# Where we will save the profile pictures locally for now
file:
  upload-dir: uploads/profiles/

servlet:
  multipart:
    max-file-size: 5MB
    max-request-size: 5MB

